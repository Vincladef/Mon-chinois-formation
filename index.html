const LS='mon-chinois-resserre-v2';let state={done:[],current:0};try{let s=JSON.parse(localStorage.getItem(LS)||'{}');state.done=Array.isArray(s.done)?s.done.filter(Number.isInteger):[];state.current=Number.isInteger(s.current)?s.current:0}catch{};

function moduleLessonIds(i){return DATA.lessons.filter(x=>x.module===i).map(x=>x.id)}
function updateNav(){let q=document.getElementById('search').value.toLowerCase().trim();document.getElementById('modules').innerHTML=DATA.modules.map((m,i)=>{let ls=moduleLessonIds(i),n=ls.filter(id=>state.done.includes(id)).length;return !q||m.title.toLowerCase().includes(q)||ls.some(id=>DATA.lessons[id].title.toLowerCase().includes(q))?`<button class="mod ${DATA.lessons[active].module===i?'active':''}" data-mod="${i}"><span class="mn">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(m.title)}</strong><small>${n} / ${ls.length} leçons validées</small></span></button>`:''}).join('')||'<p class="empty">Aucun résultat</p>';document.getElementById('headerprogress').textContent=`${state.done.length} / ${DATA.lessons.length} leçons`;document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.mod));}
function nextLessonId(){
 const current=Number.isInteger(state.current)?Math.max(0,Math.min(state.current,DATA.lessons.length-1)):0;
 if(!state.done.includes(current))return current;
 for(let i=current+1;i<DATA.lessons.length;i++)if(!state.done.includes(i))return i;
 for(let i=0;i<current;i++)if(!state.done.includes(i))return i;
 return current;
}
function openHome(){
 page='home';const total=DATA.lessons.length,done=state.done.filter(id=>id>=0&&id<total).length;
 const next=nextLessonId(),l=DATA.lessons[next],chapter=DATA.modules[l.module],chapterIds=moduleLessonIds(l.module);
 const chapterDone=chapterIds.filter(id=>state.done.includes(id)).length;
 const finished=done===total;
 document.getElementById('main').innerHTML=`<section class="home-hero"><div class="eyebrow">MON PARCOURS</div><h1>${finished?'Bravo, parcours terminé !':done===0?'Bienvenue dans ton cours de chinois':'Reprends ton chinois à ton rythme.'}</h1><p class="intro">${finished?'Tu as validé toutes les leçons. Tu peux reprendre un chapitre et continuer à pratiquer.':'Une leçon à la fois ; aucune échéance et rien à organiser. Voici où tu en es.'}</p></section><div class="progressbar"><span>Progression globale</span><span>${done} / ${total} leçons</span></div><div class="progress"><div style="width:${100*done/total}%"></div></div><div class="home-stats"><div class="home-stat"><b>${done}</b><span>Leçons validées</span></div><div class="home-stat"><b>${total-done}</b><span>À découvrir</span></div><div class="home-stat"><b>${Math.round(done/total*100)} %</b><span>Parcours accompli</span></div></div><section class="home-next"><div class="eyebrow">${finished?'REVOIR UNE LEÇON':'TA PROCHAINE LEÇON'}</div><h2>${esc(l.title)}</h2><p>${esc(chapter.title)} · Leçon ${chapterIds.indexOf(next)+1} / ${chapterIds.length}</p><p class="tiny">Dans ce chapitre : ${chapterDone} / ${chapterIds.length} leçons validées</p><button class="primary home-cta" id="home-continue">${finished?'Revoir cette leçon':'Continuer mon apprentissage'} →</button></section><section class="home-chapters"><h2>Mes chapitres</h2>${DATA.modules.map((m,i)=>{const ids=moduleLessonIds(i),n=ids.filter(id=>state.done.includes(id)).length;return `<button class="home-chapter" data-home-mod="${i}"><strong>${String(i+1).padStart(2,'0')} · ${esc(m.title)}</strong><span>${n} / ${ids.length} →</span></button>`}).join('')}</section><p class="footer">Ta progression est sauvegardée sur cet appareil. Tu peux suivre ou reprendre n'importe quelle leçon.</p>`;
 document.getElementById('home-continue').onclick=()=>openLesson(next);
 document.querySelectorAll('[data-home-mod]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.homeMod));
 updateNav();hideMenu();window.scrollTo(0,0);
}
function openModule(mi){page='module';active=moduleLessonIds(mi)[0];let m=DATA.modules[mi],ids=moduleLessonIds(mi),n=ids.filter(id=>state.done.includes(id)).length;document.getElementById('main').innerHTML=`<div class="eyebrow">CHAPITRE ${String(mi+1).padStart(2,'0')}</div><h1>${esc(m.title)}</h1><p class="intro">${esc(m.desc)}. Choisis une leçon, dans l’ordre qui te convient.</p><div class="progressbar"><span>Progression du chapitre</span><span>${n} / ${ids.length}</span></div><div class="progress"><div style="width:${100*n/ids.length}%"></div></div><div class="lesson-grid">${ids.map((id,i)=>{let l=DATA.lessons[id];return `<button class="lesson-card" data-lesson="${id}"><span class="${state.done.includes(id)?'done':''}">${state.done.includes(id)?'✓ Terminée':'Leçon '+(i+1)}</span><b>${esc(l.title)}</b><span>${esc(l.pinyin)}</span></button>`}).join('')}</div><div class="rec">Tu peux revenir ici à tout moment. Aucun chapitre n’est verrouillé ; une leçon peut être refaite autant de fois que nécessaire.</div>`;document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.lesson));updateNav();hideMenu();window.scrollTo(0,0)}
function distractors(l,offset){let group=DATA.lessons.filter(x=>x.module===l.module&&x.id!==l.id);if(group.length<3)group=DATA.lessons.filter(x=>x.id!==l.id);let picks=[];for(let i=0;i<group.length&&picks.length<3;i++){let p=group[(l.id*7+i*5+offset)%group.length];if(!picks.some(x=>x.id===p.id)&&p.meaning!==l.meaning&&p.pinyin!==l.pinyin)picks.push(p)}return picks}
function options(l,kind){let bad=distractors(l,kind==='meaning'?2:5);let vals=[kind==='meaning'?l.meaning:l.pinyin,...bad.map(x=>kind==='meaning'?x.meaning:x.pinyin)];let rotate=l.id%4;return vals.map((v,i)=>({value:v,correct:i===0})).sort((a,b)=>(vals.indexOf(a.value)+rotate)%4-(vals.indexOf(b.value)+rotate)%4)}

const MODULE_READING=[{"aim":"Le mandarin repose sur des syllabes dont la mélodie modifie le sens. Les consonnes j, q, x, zh, ch et sh demandent aussi une position précise de la langue.","rule":"Écoute chaque famille de sons, puis répète à voix haute. Travaille les quatre tons sur une même syllabe : mā, má, mǎ, mà.","pitfall":"Confondre les sons et prononcer les mots uniquement à partir de l'orthographe française."},{"aim":"Le pinyin transcrit les sons du mandarin en alphabet latin et ajoute des marques de tons. Il permet d'apprendre à prononcer avant de maîtriser les caractères.","rule":"Repère l'initiale, la finale et la marque de ton ; lis d'abord chaque syllabe distinctement, puis la phrase.","pitfall":"Prendre le pinyin pour un alphabet qui se lit exactement comme le français."},{"aim":"Les premiers échanges utilisent quelques structures très fréquentes pour saluer, se présenter, poser une question et parler de soi.","rule":"Apprends l'expression dans son ensemble ; écoute l'intonation et essaie ensuite de modifier le prénom ou le sujet.","pitfall":"Apprendre le mot français équivalent sans comprendre la situation où l'expression s'emploie."},{"aim":"Une phrase mandarine simple peut suivre sujet + verbe + objet. Les mots grammaticaux et les particules modifient ensuite son sens.","rule":"Commence par une phrase affirmative simple. Remplace le sujet ou l'objet, puis essaie de former ta propre phrase.","pitfall":"Transposer directement les conjugaisons et les articles du français."},{"aim":"L'écriture utilise des caractères chinois, souvent combinés pour former des mots. Apprendre les composants et observer l'ordre des traits facilite la mémorisation.","rule":"Regarde d'abord la forme globale, trouve des composants connus et reconstitue le caractère de mémoire.","pitfall":"Confondre lecture des caractères, écriture à la main et transcription phonétique."},{"aim":"Ce grand cours rassemble des thèmes de niveau débutant : prononciation, nombres, jours, questions, vocabulaire et bases grammaticales.","rule":"Avance librement dans cette vidéo complète ; fais des pauses entre ses grandes parties et reformule chaque exemple à l'oral.","pitfall":"Regarder plusieurs heures passivement sans réutiliser les exemples."}];
const EXTENDED=[[["Les tons","妈|mā|maman","麻|má|chanvre","马|mǎ|cheval","骂|mà|gronder"],["Les consonnes","鸡|jī|poulet","七|qī|sept","西|xī|ouest","吃|chī|manger"],["Enchaîner","你好|nǐ hǎo|bonjour","谢谢|xièxie|merci"]],[["Initiales et finales","妈|mā|maman","书|shū|livre","水|shuǐ|eau"],["Les sons particuliers","学|xué|étudier","女|nǚ|femme","中|zhōng|milieu"],["Lire des mots","中文|Zhōngwén|chinois","朋友|péngyou|ami"]],[["Se présenter","你好|nǐ hǎo|bonjour","我叫小明|wǒ jiào Xiǎomíng|je m'appelle Xiaoming","我是法国人|wǒ shì Fǎguó rén|je suis français"],["Interroger","你好吗|nǐ hǎo ma|comment vas-tu ?","你叫什么名字|nǐ jiào shénme míngzi|comment t'appelles-tu ?"],["Exprimer ses goûts","我喜欢中文|wǒ xǐhuan Zhōngwén|j'aime le chinois"]],[["Sujet, verbe, objet","我学中文|wǒ xué Zhōngwén|j'apprends le chinois","他喝水|tā hē shuǐ|il boit de l'eau"],["Négation","我不喝茶|wǒ bù hē chá|je ne bois pas de thé","我没有钱|wǒ méiyǒu qián|je n'ai pas d'argent"],["Questions et possession","你喝水吗|nǐ hē shuǐ ma|bois-tu de l'eau ?","这是我的书|zhè shì wǒ de shū|c'est mon livre"]],[["Caractères simples","我|wǒ|moi","你|nǐ|toi","水|shuǐ|eau","日|rì|soleil / jour"],["Assembler des mots","中国|Zhōngguó|Chine","学生|xuésheng|étudiant"],["Pratiquer","学习|xuéxí|étudier","喝水|hē shuǐ|boire de l'eau"]],[["Dialoguer","你好|nǐ hǎo|bonjour","谢谢|xièxie|merci","对不起|duìbuqǐ|désolé"],["Nombres et prix","一二三|yī èr sān|un deux trois","多少钱|duōshao qián|combien ça coûte ?"],["Au quotidien","我要一杯水|wǒ yào yì bēi shuǐ|je voudrais un verre d'eau","洗手间在哪里|xǐshǒujiān zài nǎlǐ|où sont les toilettes ?"]]];
const COURSE_INTRO=["Le mandarin se distingue par ses tons : la mélodie de la syllabe change le sens. Entraîne ton oreille et ton articulation, notamment les consonnes qui n'existent pas en français.","Le pinyin transcrit la prononciation avec des lettres latines et des accents de ton. Repère l'initiale, la finale et le ton ; ne lis pas ces lettres comme en français.","Les premiers dialogues utilisent des expressions toutes faites pour saluer, se présenter et poser des questions. Écoute d'abord l'ensemble de la phrase ; puis remplace un mot.","Les phrases simples suivent souvent l'ordre sujet + verbe + complément. 不 marque une négation courante ; 没有 nie notamment la possession. 吗 termine des questions oui/non.","Les caractères se reconnaissent par leurs composants et leur forme. Un mot peut combiner plusieurs caractères. Associe la forme à la prononciation et au sens.","Cette synthèse pour débutants couvre expressions, nombres et situations courantes. Alterne découverte, écoute active et répétition pour éviter un visionnage passif."];
function sayChinese(value){if(!('speechSynthesis' in window)){alert('Synthèse vocale indisponible');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(value);u.lang='zh-CN';u.rate=.8;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u);}
function writtenCourse(l){const m=MODULE_READING[l.module];return `<details class="readcourse" id="written-course"><summary><span>📖 Lire le cours <span class="tiny" style="display:block;font-weight:400;margin-top:2px">Synthèse approfondie · écouter et répéter</span></span><span class="chev">⌄</span></summary><div class="readbody"><p class="subtle">Support pédagogique lié au thème de la vidéo, et non transcription de celle-ci.</p><h3>Comprendre le thème</h3><p>${esc(COURSE_INTRO[l.id])}</p><p class="tip">${esc(m.rule)}</p>${EXTENDED[l.id].map((g,i)=>`<h3>${i+1}. ${esc(g[0])}</h3><div class="vocab-grid">${g.slice(1).map(item=>{const [hanzi,pinyin,meaning]=item.split('|');return `<div class="vocab-row"><div><strong lang="zh-Hans">${esc(hanzi)}</strong><div class="roman">${esc(pinyin)}</div><div class="fr">${esc(meaning)}</div></div><button type="button" class="listen-btn" data-say="${esc(hanzi)}">▶ Écouter</button></div>`}).join('')}</div>`).join('')}<h3>Exercice oral</h3><ol><li>Écoute les expressions sans lire le pinyin.</li><li>Répète chaque phrase en respectant les tons.</li><li>Cache la transcription et essaie de retrouver la prononciation.</li><li>Reformule deux exemples de mémoire à voix haute.</li></ol><p class="tip">À surveiller : ${esc(m.pitfall)} La synthèse vocale aide à pratiquer ; utilise aussi la vidéo pour observer l'articulation.</p></div></details>`;}
let currentOptions=[];
function openLesson(id){id=Math.max(0,Math.min(DATA.lessons.length-1,id));active=id;state.current=id;save();page='lesson';selected=[null,null];verified=false;let l=DATA.lessons[id],mod=DATA.modules[l.module],v=DATA.videos[l.video],modIds=moduleLessonIds(l.module),pos=modIds.indexOf(id);currentOptions=[options(l,'meaning'),options(l,'pinyin')];const hasVideo=true;v=DATA.videos[l.video];let url=`https://www.youtube-nocookie.com/embed/${v.id}?rel=0&playsinline=1`;
document.getElementById('main').innerHTML=`<button class="back" id="return">← Accueil</button><div class="eyebrow" style="margin-top:24px">${esc(mod.title.toUpperCase())} · LEÇON ${pos+1} / ${modIds.length}</div><h1>${esc(l.title)} ${state.done.includes(id)?'<span style="font-size:18px;color:var(--green)">✓</span>':''}</h1><p class="intro">Un cours complet en français, sa fiche de révision et deux questions pour retenir les notions.</p><div class="progressbar"><span>Progression totale</span><span>${state.done.length} / ${DATA.lessons.length}</span></div><div class="progress"><div style="width:${100*state.done.length/DATA.lessons.length}%"></div></div>${hasVideo?`<section class="videocard"><div class="frame"><iframe src="${url}" title="${esc(v.title)}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="videometa"><span>${esc(v.author)} · Vidéo complète en français : ${esc(v.title)}</span><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/watch?v=${v.id}">Ouvrir sur YouTube ↗</a></div></section>`:`<section class="video-unavailable"><strong>Apprendre sans vidéo</strong><p>Pas de vidéo francophone suffisamment ciblée et vérifiée pour cette notion. Lis le cours ci-dessous et entraîne-toi avec les exercices ; aucune vidéo générale ne t’est imposée.</p></section>`}${writtenCourse(l)}<section class="examples"><div class="eyebrow">À DIRE À VOIX HAUTE</div><p class="hanzi" lang="zh-Hans">${esc(l.hanzi)}</p><p class="pinyin">${esc(l.pinyin)}</p><p class="meaning">${esc(l.meaning)}</p><div class="line" style="margin-bottom:17px"><button class="smallbtn" id="speak">▶ Écouter en mandarin</button><button class="smallbtn" id="repeat">↻ Répéter sans regarder</button></div><p class="note"><b>À retenir :</b> ${esc(l.note)}</p></section><section class="quiz"><div class="eyebrow">MINI-QUIZ</div><h2>As-tu retenu l’essentiel ?</h2><p class="tiny">Deux questions rapides. Corrigé immédiat après validation.</p><div class="question">1. Que signifie « ${esc(l.hanzi)} » ?</div>${optHtml(currentOptions[0],0)}<div class="question">2. Quel pinyin correspond à « ${esc(l.hanzi)} » ?</div>${optHtml(currentOptions[1],1)}<button class="primary" style="margin-top:13px" id="check" disabled>Vérifier mes réponses</button><p class="feedback" id="globalFeedback" aria-live="polite"></p></section><div class="actions"><button class="secondary" id="prev" ${id===0?'disabled':''}>← Précédent</button><button class="primary" id="next">${id===DATA.lessons.length-1?'Terminer le parcours':'Leçon suivante →'}</button></div><div class="footer">Aucun compte nécessaire. Tes leçons validées restent enregistrées dans ce navigateur. L’audio vocal dépend des voix disponibles sur ton appareil et de leur qualité. Les vidéos YouTube demandent une connexion et l’autorisation d’intégration accordée par leur auteur.</div>`;
document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>sayChinese(b.dataset.say));document.getElementById('return').onclick=openHome;document.getElementById('prev').onclick=()=>openLesson(id-1);document.getElementById('next').onclick=()=>id===DATA.lessons.length-1?openHome():openLesson(id+1);
document.getElementById('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('La synthèse vocale n’est pas disponible sur ce navigateur.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(l.hanzi);u.lang='zh-CN';u.rate=.75;let voices=speechSynthesis.getVoices();let voice=voices.find(v=>v.lang.toLowerCase().startsWith('zh'));if(voice)u.voice=voice;speechSynthesis.speak(u)};
document.getElementById('repeat').onclick=()=>{let a=document.querySelector('.hanzi'),b=document.querySelector('.pinyin'),c=document.querySelector('.meaning');let hidden=a.style.filter!=='';[a,b,c].forEach(x=>x.style.filter=hidden?'':'blur(7px)');document.getElementById('repeat').textContent=hidden?'↻ Répéter sans regarder':'👁 Afficher la réponse'};
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(verified)return;let q=+b.dataset.q;selected[q]=+b.dataset.i;document.querySelectorAll(`[data-q="${q}"]`).forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});document.getElementById('check').disabled=selected.includes(null)});
document.getElementById('check').onclick=()=>{if(selected.includes(null))return;verified=true;let correct=0;[0,1].forEach(q=>{let o=currentOptions[q],win=o.findIndex(x=>x.correct);if(selected[q]===win)correct++;document.querySelectorAll(`[data-q="${q}"]`).forEach((b,i)=>{b.disabled=true;if(i===win)b.classList.add('correct');else if(i===selected[q])b.classList.add('wrong')});document.getElementById('feedback'+q).textContent=selected[q]===win?'Bonne réponse.':'Réponse attendue : '+o[win].value});if(correct===2){if(!state.done.includes(id))state.done.push(id);save();document.getElementById('globalFeedback').textContent='✓ Leçon validée ! Tu peux continuer à ton rythme.';document.getElementById('globalFeedback').style.color='var(--green)'}else{document.getElementById('globalFeedback').innerHTML='Tu as '+correct+'/2. <button class="smallbtn" id="retry">Réessayer</button>';document.getElementById('retry').onclick=()=>openLesson(id)};updateNav()};updateNav();hideMenu();window.scrollTo(0,0)}
function hideMenu(){document.getElementById('aside').classList.remove('show')}
document.getElementById('menu').onclick=()=>document.getElementById('aside').classList.toggle('show');document.getElementById('search').oninput=updateNav;
document.getElementById('home-link').onclick=openHome;
document.getElementById('home-logo').onclick=openHome;
document.getElementById('home-logo').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openHome()}};
openHome();
</script></body></html>
