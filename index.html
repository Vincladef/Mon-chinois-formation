const DATA={"modules": [{"title": "Prononciation", "desc": "Oreille, pinyin et articulation"}, {"title": "Premiers échanges", "desc": "Construire de vraies mini-conversations"}, {"title": "Phrases et grammaire", "desc": "Les mécanismes essentiels du mandarin"}, {"title": "Nombres, temps et repères", "desc": "Compter, se repérer, dater"}, {"title": "Comprendre et dialoguer", "desc": "Parler avec souplesse"}, {"title": "Caractères et écriture", "desc": "Lire, reconnaître et saisir le chinois"}, {"title": "Situations réelles", "desc": "Se débrouiller en Chine"}, {"title": "Aller plus loin", "desc": "Consolidation vers le niveau intermédiaire"}], "videos": [{"title": "Apprendre le chinois en une vidéo", "id": "bsxrsBs1Y3U", "author": "Tev, Ici Japon"}, {"title": "Comment bien prononcer le mandarin", "id": "eMxfksudvfU", "author": "Faguoren 法国人"}, {"title": "Chinois pour débutants : cours complet HSK 1", "id": "HVwBcoYFWzY", "author": "LangAdvance Chinese"}, {"title": "7 étapes pour apprendre les caractères", "id": "slPJVPWAN3M", "author": "Faguoren 法国人"}], "lessons": [{"id": 0, "module": 0, "title": "Les syllabes", "hanzi": "你好", "pinyin": "nǐ hǎo", "meaning": "Bonjour", "note": "Une syllabe réunit une initiale, une finale et généralement un ton.", "video": 1, "start": 99, "end": 206}, {"id": 1, "module": 0, "title": "Lire le pinyin", "hanzi": "中文", "pinyin": "Zhōngwén", "meaning": "Langue chinoise", "note": "Le pinyin note la prononciation, pas les caractères eux-mêmes.", "video": 1, "start": 207, "end": 299}, {"id": 2, "module": 0, "title": "Consonnes aspirées", "hanzi": "爸爸", "pinyin": "bàba", "meaning": "Papa", "note": "Souffle énergique pour p, t, k, q, ch et c ; compare les paires.", "video": 1, "start": 300, "end": 579}, {"id": 3, "module": 0, "title": "J, Q et X", "hanzi": "谢谢", "pinyin": "xièxie", "meaning": "Merci", "note": "Pour x, avance la langue près des dents du bas ; évite le son français « ks ».", "video": 1, "start": 580, "end": 733}, {"id": 4, "module": 0, "title": "ZH, CH, SH et R", "hanzi": "认识", "pinyin": "rènshi", "meaning": "Connaître une personne", "note": "La pointe de la langue remonte vers la zone derrière les alvéoles.", "video": 1, "start": 580, "end": 733}, {"id": 5, "module": 0, "title": "Les finales en A", "hanzi": "妈妈", "pinyin": "māma", "meaning": "Maman", "note": "Travaille an et ang, puis compare la nasalité finale.", "video": 1, "start": 754, "end": 834}, {"id": 6, "module": 0, "title": "Les finales en E et O", "hanzi": "哥哥", "pinyin": "gēge", "meaning": "Grand frère", "note": "En chinois, e ne se lit pas toujours comme en français.", "video": 1, "start": 835, "end": 958}, {"id": 7, "module": 0, "title": "I, U et Ü", "hanzi": "女儿", "pinyin": "nǚ’ér", "meaning": "Fille (de ses parents)", "note": "Pour ü, arrondis les lèvres tout en maintenant la langue vers l’avant.", "video": 1, "start": 959, "end": 1318}, {"id": 8, "module": 0, "title": "Les quatre tons", "hanzi": "马", "pinyin": "mǎ", "meaning": "Cheval", "note": "Le troisième ton isolé descend puis remonte ; en contexte, il est souvent simplifié.", "video": 2, "start": 858, "end": 1732}, {"id": 9, "module": 0, "title": "Tons combinés", "hanzi": "你好", "pinyin": "nǐ hǎo", "meaning": "Bonjour", "note": "Deux troisièmes tons successifs : le premier se réalise comme un deuxième ton.", "video": 0, "start": 1144, "end": 1374}, {"id": 10, "module": 0, "title": "Tons neutres", "hanzi": "什么", "pinyin": "shénme", "meaning": "Quoi", "note": "Le ton neutre est bref ; sa hauteur dépend de la syllabe précédente.", "video": 2, "start": 858, "end": 1732}, {"id": 11, "module": 0, "title": "Atelier de révision", "hanzi": "再见", "pinyin": "zàijiàn", "meaning": "Au revoir", "note": "Enregistre-toi, puis compare les consonnes, les voyelles et les tons.", "video": 1, "start": 1630, "end": 1820}, {"id": 12, "module": 1, "title": "Dire bonjour", "hanzi": "你好", "pinyin": "nǐ hǎo", "meaning": "Bonjour", "note": "Formule simple et courante.", "video": 2, "start": 4442, "end": 4890}, {"id": 13, "module": 1, "title": "Se présenter", "hanzi": "我叫小明", "pinyin": "wǒ jiào Xiǎomíng", "meaning": "Je m’appelle Xiaoming", "note": "叫 introduit le prénom.", "video": 0, "start": 570, "end": 635}, {"id": 14, "module": 1, "title": "Être français", "hanzi": "我是法国人", "pinyin": "wǒ shì Fǎguó rén", "meaning": "Je suis français", "note": "是 relie les noms ; les adjectifs fonctionnent différemment.", "video": 2, "start": 4442, "end": 4890}, {"id": 15, "module": 1, "title": "Être étudiant", "hanzi": "我是学生", "pinyin": "wǒ shì xuésheng", "meaning": "Je suis étudiant", "note": "学生 signifie élève ou étudiant selon le contexte.", "video": 0, "start": 570, "end": 635}, {"id": 16, "module": 1, "title": "Poser une question", "hanzi": "你是学生吗？", "pinyin": "nǐ shì xuésheng ma?", "meaning": "Es-tu étudiant ?", "note": "吗 transforme une affirmation en question fermée.", "video": 2, "start": 4442, "end": 4890}, {"id": 17, "module": 1, "title": "Dire merci", "hanzi": "谢谢你", "pinyin": "xièxie nǐ", "meaning": "Merci à toi", "note": "谢谢 se prononce avec un ton neutre sur la seconde syllabe.", "video": 0, "start": 3303, "end": 3475}, {"id": 18, "module": 1, "title": "Répondre poliment", "hanzi": "不客气", "pinyin": "bú kèqi", "meaning": "De rien", "note": "不 devient souvent bú devant une syllabe au quatrième ton.", "video": 2, "start": 4442, "end": 4890}, {"id": 19, "module": 1, "title": "Demander le nom", "hanzi": "你叫什么名字？", "pinyin": "nǐ jiào shénme míngzi?", "meaning": "Comment t’appelles-tu ?", "note": "什么 demande « quel / quoi ».", "video": 0, "start": 1680, "end": 1745}, {"id": 20, "module": 1, "title": "Dire au revoir", "hanzi": "明天见", "pinyin": "míngtiān jiàn", "meaning": "À demain", "note": "见 exprime ici l’idée de se revoir.", "video": 2, "start": 4442, "end": 4890}, {"id": 21, "module": 2, "title": "Ordre des mots", "hanzi": "我喜欢中文", "pinyin": "wǒ xǐhuan Zhōngwén", "meaning": "J’aime le chinois", "note": "L’ordre de base est sujet, verbe, objet.", "video": 0, "start": 465, "end": 529}, {"id": 22, "module": 2, "title": "Nier avec 不", "hanzi": "我不喜欢咖啡", "pinyin": "wǒ bù xǐhuan kāfēi", "meaning": "Je n’aime pas le café", "note": "不 nie de nombreuses actions et qualités.", "video": 0, "start": 799, "end": 859}, {"id": 23, "module": 2, "title": "Nier avec 没", "hanzi": "我没有钱", "pinyin": "wǒ méiyǒu qián", "meaning": "Je n’ai pas d’argent", "note": "没 s’emploie notamment pour nier 有.", "video": 0, "start": 2532, "end": 2652}, {"id": 24, "module": 2, "title": "Le verbe avoir", "hanzi": "我有一本书", "pinyin": "wǒ yǒu yì běn shū", "meaning": "J’ai un livre", "note": "有 indique la possession ou l’existence.", "video": 0, "start": 2532, "end": 2652}, {"id": 25, "module": 2, "title": "Possession avec 的", "hanzi": "我的朋友", "pinyin": "wǒ de péngyou", "meaning": "Mon ami", "note": "的 relie le possesseur au nom.", "video": 0, "start": 1416, "end": 1483}, {"id": 26, "module": 2, "title": "Aussi avec 也", "hanzi": "我也是学生", "pinyin": "wǒ yě shì xuésheng", "meaning": "Moi aussi, je suis étudiant", "note": "也 précède le verbe.", "video": 0, "start": 1375, "end": 1416}, {"id": 27, "module": 2, "title": "Adjectifs prédicats", "hanzi": "她很高", "pinyin": "tā hěn gāo", "meaning": "Elle est grande", "note": "很 est souvent naturel avec un adjectif, même sans intensité forte.", "video": 0, "start": 749, "end": 799}, {"id": 28, "module": 2, "title": "Dire vouloir", "hanzi": "我想喝茶", "pinyin": "wǒ xiǎng hē chá", "meaning": "Je voudrais boire du thé", "note": "想 marque une envie ou une intention.", "video": 0, "start": 4270, "end": 4380}, {"id": 29, "module": 2, "title": "Dire pouvoir", "hanzi": "我会说中文", "pinyin": "wǒ huì shuō Zhōngwén", "meaning": "Je sais parler chinois", "note": "会 peut exprimer une capacité acquise.", "video": 0, "start": 4310, "end": 4400}, {"id": 30, "module": 2, "title": "Question « qui »", "hanzi": "谁是老师？", "pinyin": "shéi shì lǎoshī?", "meaning": "Qui est le professeur ?", "note": "Le mot interrogatif reste à la place de la réponse.", "vid function distractors(l,offset){let group=DATA.lessons.filter(x=>x.module===l.module&&x.id!==l.id);if(group.length<3)group=DATA.lessons.filter(x=>x.id!==l.id);let picks=[];for(let i=0;i<group.length&&picks.length<3;i++){let p=group[(l.id*7+i*5+offset)%group.length];if(!picks.some(x=>x.id===p.id)&&p.meaning!==l.meaning&&p.pinyin!==l.pinyin)picks.push(p)}return picks}

document.getElementById('repeat').onclick=()=>{let a=document.querySelector('.hanzi'),b=document.querySelector('.pinyin'),c=document.querySelector('.meaning');let hidden=a.style.filter!=='';[a,b,c].forEach(x=>x.style.filter=hidden?'':'blur(7px)');document.getElementById('repeat').textContent=hidden?'↻ Répéter sans regarder':'👁 Afficher la réponse'};
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(verified)return;let q=+b.dataset.q;selected[q]=+b.dataset.i;document.querySelectorAll(`[data-q="${q}"]`).forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});document.getElementById('check').disabled=selected.includes(null)});
document.getElementById('check').onclick=()=>{if(selected.includes(null))return;verified=true;let correct=0;[0,1].forEach(q=>{let o=currentOptions[q],win=o.findIndex(x=>x.correct);if(selected[q]===win)correct++;document.querySelectorAll(`[data-q="${q}"]`).forEach((b,i)=>{b.disabled=true;if(i===win)b.classList.add('correct');else if(i===selected[q])b.classList.add('wrong')});document.getElementById('feedback'+q).textContent=selected[q]===win?'Bonne réponse.':'Réponse attendue : '+o[win].value});if(correct===2){if(!state.done.includes(id))state.done.push(id);save();document.getElementById('globalFeedback').textContent='✓ Leçon validée ! Tu peux continuer à ton rythme.';document.getElementById('globalFeedback').style.color='var(--green)'}else{document.getElementById('globalFeedback').innerHTML='Tu as '+correct+'/2. <button class="smallbtn" id="retry">Réessayer</button>';document.getElementById('retry').onclick=()=>openLesson(id)};updateNav()};updateNav();hideMenu();window.scrollTo(0,0)}
function hideMenu(){document.getElementById('aside').classList.remove('show')}
document.getElementById('menu').onclick=()=>document.getElementById('aside').classList.toggle('show');document.getElementById('search').oninput=updateNav;
openLesson(Math.min(Math.max(state.current,0),DATA.lessons.length-1));
</script></body></html>
